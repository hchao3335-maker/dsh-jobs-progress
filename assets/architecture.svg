<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="架构：后台脚本 → Host 任务注册表 → Client ctx.jobs → 输入框上方面板">
  <title>dsh-jobs-progress architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a93a6" />
    </marker>
  </defs>
  <style>
    .box { fill: #f7f8fc; stroke: #ccd3e3; stroke-width: 1.5; }
    .host { fill: #eef2ff; stroke: #6c7cff; stroke-width: 1.8; }
    .browser { fill: #eef7f2; stroke: #22a06b; stroke-width: 1.8; }
    .t { font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2430; }
    .s { font: 400 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5b6478; }
    .m { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #4d5566; }
    .l { font: 400 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7488; }
    .k { font: 600 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8a93a6; letter-spacing: .08em; }
    .a { stroke: #8a93a6; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #d7dce8; stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>

  <text class="k" x="30" y="36">HOST</text>
  <text class="k" x="470" y="36">BROWSER</text>
  <line class="dash" x1="450" y1="48" x2="450" y2="250" />

  <rect class="box" x="24" y="76" width="176" height="140" rx="14" />
  <text class="t" x="112" y="112" text-anchor="middle">后台脚本</text>
  <text class="s" x="112" y="138" text-anchor="middle">pwsh · bash · 其他</text>
  <text class="m" x="112" y="162" text-anchor="middle">stdout / stderr</text>
  <text class="s" x="112" y="190" text-anchor="middle">长任务 · 进度行</text>

  <rect class="host" x="240" y="66" width="190" height="160" rx="14" />
  <text class="t" x="335" y="104" text-anchor="middle">Host 任务注册表</text>
  <text class="s" x="335" y="130" text-anchor="middle">job.list · job.follow</text>
  <text class="m" x="335" y="154" text-anchor="middle">rows / observed</text>
  <text class="s" x="335" y="182" text-anchor="middle">状态 · 进度 · 输出环</text>
  <text class="s" x="335" y="204" text-anchor="middle">kill 请求</text>

  <rect class="browser" x="470" y="66" width="190" height="160" rx="14" />
  <text class="t" x="565" y="104" text-anchor="middle">Client ctx.jobs</text>
  <text class="s" x="565" y="130" text-anchor="middle">watchRows · observe</text>
  <text class="m" x="565" y="154" text-anchor="middle">rows / observed</text>
  <text class="s" x="565" y="182" text-anchor="middle">引用计数共享流</text>
  <text class="s" x="565" y="204" text-anchor="middle">kill 透传</text>

  <rect class="browser" x="700" y="66" width="176" height="160" rx="14" />
  <text class="t" x="788" y="104" text-anchor="middle">面板</text>
  <text class="s" x="788" y="130" text-anchor="middle">input.dock</text>
  <text class="m" x="788" y="154" text-anchor="middle">order 15</text>
  <text class="s" x="788" y="182" text-anchor="middle">进度条 · 输出尾部</text>
  <text class="s" x="788" y="204" text-anchor="middle">两段式停止</text>

  <line class="a" x1="202" y1="146" x2="232" y2="146" />
  <text class="l" x="217" y="134" text-anchor="middle">输出</text>
  <line class="a" x1="432" y1="146" x2="462" y2="146" />
  <text class="l" x="447" y="134" text-anchor="middle">frames</text>
  <line class="a" x1="662" y1="146" x2="692" y2="146" />
  <text class="l" x="677" y="134" text-anchor="middle">hooks</text>

  <path class="a" d="M788 226 V258 H335 V236" />
  <rect x="520" y="247" width="96" height="18" rx="4" fill="#eef2ff" />
  <text class="l" x="568" y="260" text-anchor="middle">kill / stop</text>

  <text class="l" x="450" y="300" text-anchor="middle">1.5 s 后出现 · 结算后 30 s 消失 · 自动观察 4 条运行中 + 2 条结算</text>
</svg>
